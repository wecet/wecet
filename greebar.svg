  <text x="128" y="108" font-size="12" fill="#8e8e93">Simulated device · Preview mode</text>
  <circle cx="660" cy="92" r="20" class="pw" fill="#4aa8ff"/><text x="660" y="98" text-anchor="middle" font-size="16" fill="#ffffff">⏻</text>
  <circle cx="400" cy="230" r="150" fill="url(#cool)"/>
