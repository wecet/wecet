  <text x="40" y="428" font-size="15" font-weight="700" fill="#ffffff">GreeBar</text>
  <text x="112" y="428" font-size="14" fill="#a1a1aa">My Gree air con, from the macOS menu bar · SwiftUI · local AES protocol</text>
