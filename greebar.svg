  <rect x="520" y="6" width="66" height="19" rx="5" fill="#ffffff" fill-opacity=".14"/>
  <rect x="96" y="48" width="608" height="352" rx="22" fill="#11151b" stroke="#ffffff" stroke-opacity=".08"/>
