<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>
    .air{stroke-dasharray:10 14;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-48}}
    .wave{animation:wave 3s ease-in-out infinite}
    @keyframes wave{0%,100%{opacity:.25}50%{opacity:.9}}
    .louver{transform-origin:400px 168px;animation:swing 4s ease-in-out infinite}
    @keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
    .t{opacity:0;animation:t 12s infinite}
    @keyframes t{0%,22%{opacity:1}25%,100%{opacity:0}}
    .pw{animation:pw 2.4s ease-in-out infinite}
    @keyframes pw{0%,100%{fill-opacity:.25}50%{fill-opacity:.6}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2230"/><stop offset="1" stop-color="#0c0f14"/></linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#c9ced6"/></linearGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#4aa8ff" stop-opacity=".35"/><stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="440" rx="20" fill="url(#bg)"/>
