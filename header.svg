<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>
    .blob{animation:drift 14s ease-in-out infinite alternate}
    .b2{animation-duration:18s;animation-direction:alternate-reverse}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(90px,30px)}}
    .type{animation:type 2.2s steps(14,end) .3s both}
    @keyframes type{from{width:0}to{width:560px}}
    .caret{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .caretmove{animation:caret 2.2s steps(14,end) .3s both}
    @keyframes caret{from{transform:translateX(0)}to{transform:translateX(392px)}}
    .fade{opacity:0;animation:fade .8s ease-out forwards}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <radialGradient id="g1"><stop offset="0" stop-color="#ff6b5a" stop-opacity=".55"/><stop offset="1" stop-color="#ff6b5a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#3fb68b" stop-opacity=".45"/><stop offset="1" stop-color="#3fb68b" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#f5c542" stop-opacity=".35"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
    <clipPath id="typeclip"><rect class="type" x="76" y="60" height="100" width="560"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0e1014"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle class="blob" cx="980" cy="60" r="260" fill="url(#g1)"/>
    <circle class="blob b2" cx="760" cy="300" r="240" fill="url(#g2)"/>
    <circle class="blob" cx="1150" cy="280" r="180" fill="url(#g3)" style="animation-duration:11s"/>
  </g>
  <text class="fade" x="80" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="3" fill="#ff8a7a" style="animation-delay:.1s">HELLO, WORLD</text>
  <g clip-path="url(#typeclip)"><text x="78" y="138" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Hi, I’m Owen.</text></g>
  <g class="caretmove"><rect class="caret" x="82" y="84" width="5" height="62" rx="2" fill="#ff6b5a"/></g>
  <text class="fade" x="80" y="186" font-size="24" fill="#c3c8d2" style="animation-delay:2.5s">AI Engineer at <tspan font-weight="700" fill="#ffffff">AIVHY</tspan> · Computer vision specialist</text>
  <g class="fade" style="animation-delay:2.90s"><rect x="80" y="216" width="77" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="119" y="237" text-anchor="middle" font-size="14" fill="#d6d9e0">Python</text></g><g class="fade" style="animation-delay:3.02s"><rect x="167.2" y="216" width="86" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="210" y="237" text-anchor="middle" font-size="14" fill="#d6d9e0">PyTorch</text></g><g class="fade" style="animation-delay:3.14s"><rect x="263.59999999999997" y="216" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="321" y="237" text-anchor="middle" font-size="14" fill="#d6d9e0">TensorFlow</text></g><g class="fade" style="animation-delay:3.26s"><rect x="387.59999999999997" y="216" width="77" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="426" y="237" text-anchor="middle" font-size="14" fill="#d6d9e0">Docker</text></g><g class="fade" style="animation-delay:3.38s"><rect x="474.79999999999995" y="216" width="151" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="550" y="237" text-anchor="middle" font-size="14" fill="#d6d9e0">Edge Computing</text></g>
</svg>
